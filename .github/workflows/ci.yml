# CI 基线（W1-P1-T03，解除 BLK-W1-03）：push + PR 触发 lint / typecheck / test / build / CLI 冒烟。
# 约定：失败必须修复，禁止删测/跳过失败/降低标准换绿（调度器红线）。
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: lint+typecheck+test+smoke (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖（锁文件精确安装）
        run: npm ci

      - name: Lint（零警告过关）
        run: npm run lint

      - name: 错误码注册表 lint（SPEC-03：三段式齐备 + docs/errors/ 零漂移 + 未注册码拦截）
        run: npm run lint:errors

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: CLI 入口冒烟（sw --version / --help）
        run: npm run smoke

      - name: 退出码约定冒烟（SPEC-03-EXT：0 成功 / 2 用法错误，真实进程断言）
        run: npm run smoke:exit-codes

      - name: 主链进程级 e2e + TTFS 基准（W3-DRAFT-T03，规格 §10-2/3）
        run: npm run smoke:e2e
